<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בחני את עצמך - חן קלימיאן</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Rubik', system-ui, sans-serif;
    direction: rtl;
    color: #3A342E;
    background: linear-gradient(180deg,#FBF8F2 0%,#F1F8F4 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
  }
  a { color: #4F9C82; text-decoration: none; }
  a:hover { color: #3B7C67; }
  #card {
    max-width: 520px;
    width: 100%;
    background: #FFFFFF;
    border-radius: 28px;
    padding: 40px 30px;
    box-shadow: 0 24px 60px rgba(58,52,46,.10);
    position: relative;
    overflow: hidden;
  }
  @media (max-width: 480px) {
    body { padding: 20px 12px; }
    #card { padding: 28px 20px; border-radius: 22px; }
    #app h2 { font-size: 18px !important; }
    .opt-btn { font-size: 14px !important; padding: 13px 14px !important; }
  }
  .blob { position: absolute; z-index: 0; }
  .content { position: relative; z-index: 1; }
  .opt-btn {
    display: block; width: 100%; text-align: right;
    background: #FAFAF7; border: 2px solid #ECE7DE; border-radius: 16px;
    padding: 16px 18px; margin-bottom: 12px;
    font-family: 'Rubik', sans-serif; font-size: 16px; color: #3A342E;
    cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .opt-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(58,52,46,.08); border-color: #C9DED6; }
  .opt-btn:active { transform: translateY(0); }
  .opt-btn.is-selected { border-color: #6FB79C; background: #EFF9F4; }
  .cta-btn {
    display: block; width: 100%; box-sizing: border-box; padding: 16px; border: none; border-radius: 16px;
    background: #6FB79C; color: #fff; text-decoration: none; text-align: center;
    font-family: 'Rubik', sans-serif; font-size: 17px; font-weight: 600; cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(58,52,46,.14); }
  .cta-btn[disabled] { opacity: .6; cursor: default; transform: none; box-shadow: none; }
  .back-lnk {
    margin-top: 6px; background: none; border: none; color: #9B9484;
    font-family: 'Rubik', sans-serif; font-size: 14px; cursor: pointer; padding: 8px 2px;
  }
  .back-lnk:hover { color: #6B6459; }
  .field {
    width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid #ECE7DE;
    font-family: 'Rubik', sans-serif; font-size: 16px; margin-bottom: 12px; box-sizing: border-box;
    text-align: center;
  }
  .field::placeholder { color: #B7AF9F; }
  input[type="range"] { width: 100%; margin-bottom: 10px; accent-color: #6FB79C; }
</style>
</head>
<body>
<div id="card">
  <div class="blob" style="top:-64px;left:-64px;width:180px;height:180px;border-radius:46% 54% 60% 40%/50% 45% 55% 50%;background:#EAF6F1;opacity:.9;"></div>
  <div class="blob" style="bottom:-74px;right:-54px;width:210px;height:210px;border-radius:60% 40% 45% 55%/55% 60% 40% 45%;background:#FCEFE0;opacity:.7;"></div>
  <div class="blob" style="top:40%;right:-40px;width:90px;height:90px;border-radius:50% 50% 45% 55%/55% 45% 55% 45%;background:#FBE4EA;opacity:.6;"></div>
  <div class="content" id="app"></div>
</div>

<script>
// ============================================================
// חיבור ה-Lead Webhook (Lead Connector / GoHighLevel)
// הדביקי כאן את כתובת ה-webhook הקיימת שלך, ואז כל טופס שנשלח
// מהשאלון הזה יגיע לאותה מערכת בדיוק כמו הטופס באתר ב-Wix.
// ============================================================
var LEAD_WEBHOOK_URL = 'https://services.leadconnectorhq.com/hooks/Qt9lEQiyh8wgVPJM4d6Q/webhook-trigger/c006972a-59f5-40cc-83a5-382a3d491bb5';

// גיבוי: כל שליחה נרשמת גם בטופס Google (טופס "שאלון קלוד"), שמזין אוטומטית
// גיליון Google Sheets. זה נשאר גם אם ה-webhook למעלה לא עובד מסיבה כלשהי.
var BACKUP_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScP4ZuIZJehRtUaHa0EXUw5eMlKXokBn9faE9R1fSkBz2Wu8w/formResponse';
var BACKUP_FORM_FIELDS = { name: 'entry.637486590', phone: 'entry.292114796' };

// בדקתי ישירות: ה-webhook של Lead Connector תומך ב-CORS מלא (Access-Control-Allow-Origin: *),
// אז אפשר לשלוח אליו fetch רגיל עם JSON תקין ולקבל גם תשובה אמיתית בחזרה.
// הבעיה המקורית לא הייתה חסימה, אלא שימוש ב-mode:'no-cors' שגרם לדפדפן למחוק
// בשקט את כותרת ה-Content-Type, כך שהשרת לא פירש נכון את הנתונים שהגיעו.
function sendJson(url, data) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).catch(function (e) {
    console.warn('[quiz] fetch to webhook failed', url, e);
  });
}

// לטפסים שלא תומכים ב-CORS (כמו Google Forms) - שולחת כטופס HTML אמיתי לתוך
// iframe מוסתר, בדיוק כמו שדפדפן שולח טופס רגיל.
function submitHiddenForm(url, fields) {
  try {
    var iframe = document.createElement('iframe');
    iframe.name = 'hidden-target-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    var form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = iframe.name;
    form.style.display = 'none';

    Object.keys(fields).forEach(function (key) {
      var input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = fields[key];
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    setTimeout(function () {
      if (form.parentNode) form.parentNode.removeChild(form);
      if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
    }, 8000);
  } catch (e) {
    console.warn('[quiz] hidden form submit failed', url, e);
  }
}

function sendLeadToWebhook(name, phone, answers) {
  if (LEAD_WEBHOOK_URL && LEAD_WEBHOOK_URL.indexOf('PASTE_') !== 0) {
    sendJson(LEAD_WEBHOOK_URL, {
      name: name,
      phone: phone,
      source: 'quiz-hachshara',
      answers: answers
    });
  } else {
    console.warn('[quiz] LEAD_WEBHOOK_URL not set - lead not sent to Lead Connector.', { name: name, phone: phone });
  }

  if (BACKUP_FORM_URL && BACKUP_FORM_URL.indexOf('PASTE_') !== 0) {
    var backupFields = {};
    backupFields[BACKUP_FORM_FIELDS.name] = name;
    backupFields[BACKUP_FORM_FIELDS.phone] = phone;
    submitHiddenForm(BACKUP_FORM_URL, backupFields);
  }
}

// ============================================================
// לוגיקת השאלון
// ============================================================
var state = {
  screen: 'intro',
  qIndex: 0,
  answers: {},
  pendingOther: false,
  otherText: '',
  sliderValue: 2,
  msSelected: [false, false, false, false, false],
  leadName: '',
  leadPhone: '',
  leadError: false,
  leadSubmitting: false
};

function trackEvent(name, data) {
  try { console.log('[funnel_event]', name, data); } catch (e) {}
}

function tenureBand(v) {
  return (v === '5-10 שנים' || v === 'יותר מ-10 שנים') ? 'veteran' : 'new';
}
function confidenceBand(v) {
  return (v === 'כן, ממש בטוחה בעצמי' || v === 'לרוב כן, אבל לפעמים מתלבטת') ? 'confident' : 'unsure';
}
function apprBand(v) {
  return v === 'כן, לגמרי' ? 'appreciated' : 'unappreciated';
}

function getRole(answers) {
  var roles = [
    { label: 'גננת', tenureQ: 'כמה שנים את עובדת כגננת?', type: 'teaching' },
    { label: 'מורה', tenureQ: 'כמה שנים את מלמדת?', type: 'teaching' },
    { label: 'קלינאית תקשורת', tenureQ: 'כמה שנות ניסיון קליני יש לך?', type: 'clinical' },
    { label: 'מרפאה בעיסוק', tenureQ: 'כמה שנות ניסיון יש לך?', type: 'clinical' },
    { label: 'סייעת', tenureQ: 'כמה שנים את עובדת כסייעת?', type: 'teaching' },
    { label: 'אחר', tenureQ: 'כמה שנות ניסיון יש לך בעבודה עם ילדים?', type: 'teaching' }
  ];
  var found = null;
  for (var i = 0; i < roles.length; i++) { if (roles[i].label === answers.role) { found = roles[i]; break; } }
  return found || roles[roles.length - 1];
}

var KNOWN_ROLES = ['גננת', 'מורה', 'קלינאית תקשורת', 'מרפאה בעיסוק', 'סייעת'];

function communityLabel(answers) {
  var map = {
    'גננת': 'גננות כמוך',
    'מורה': 'מורות כמוך',
    'קלינאית תקשורת': 'קלינאיות תקשורת כמוך',
    'מרפאה בעיסוק': 'מרפאות בעיסוק כמוך',
    'סייעת': 'סייעות כמוך'
  };
  return map[answers.role] || 'נשות חינוך וטיפול';
}

// מזהה תשובת "אחר" חופשית שמתארת סטטוס בלי הכנסה/משרה (אמא בבית, חופשת לידה
// וכו') - כדי שהשאלות הבאות לא ישאלו על "שכר" למי שאין לה כזה.
function isNonJobRoleText(answers) {
  if (!answers.role || KNOWN_ROLES.indexOf(answers.role) !== -1) return false;
  var t = answers.role;
  var keywords = ['אמא', 'אימא', 'אבא', 'הורה', 'הורים', 'עקרת בית', 'לא עובדת', 'לא עובד', 'חופשת לידה', 'בבית'];
  for (var i = 0; i < keywords.length; i++) {
    if (t.indexOf(keywords[i]) !== -1) return true;
  }
  return false;
}

// לתצוגה בתוך "בתור X, כבר...": אם היא כתבה משפט שלם ("אני בחופשת לידה"),
// מורידים את ה"אני" הפותח כדי שהמשפט המורכב יזרום קצת יותר טוב.
function roleForPrefix(answers) {
  return (answers.role || '').replace(/^אני\s+/, '');
}

function incomeAmountLabel(answers) {
  var map = {
    '1,000 ₪+ (רק כדי להתחיל, בקצב שלי)': '1,000 ₪',
    '3,000 ₪ (קבוצת הכנה לכיתה א׳ אחת, שעה בשבוע)': '3,000 ₪',
    '8,000-18,000 ₪ (כמה קבוצות או שיעורים פרטיים לילדים בגילי 5-8, 4-6 שעות בשבוע)': '8,000-18,000 ₪',
    'הכי הרבה שאפשר, אני רצינית בקטע הזה': 'כמה שיותר'
  };
  return map[answers.income] || 'הסכום שבחרת';
}

function getQuestion(index, answers) {
  if (index === 0) {
    return { type: 'choice', id: 'role', isRole: true, title: 'מה התפקיד שלך היום?', options: [
      'גננת', 'מורה', 'קלינאית תקשורת', 'מרפאה בעיסוק', 'סייעת', 'אחר'
    ]};
  }
  if (index === 1) {
    var role = getRole(answers);
    return { type: 'choice', id: 'tenure', title: role.tenureQ, options: ['פחות משנה', '1-4 שנים', '5-10 שנים', 'יותר מ-10 שנים'] };
  }
  if (index === 2) {
    return { type: 'choice', id: 'motivation', title: 'מה הכי מושך אותך בלהעביר קבוצות הכנה לכיתה א׳ ושיעורים פרטיים?', options: [
      'הרגע שרואים ילד מצליח בזכותך, זו התחושה הכי טובה',
      'האהבה לעבוד ולהיות עם ילדים, זה תמיד היה חלק ממי שאני',
      'גם ההכנסה הנוספת חשובה לי, ולא רק השליחות',
      'הכל ביחד, אי אפשר להפריד'
    ]};
  }
  if (index === 3) {
    var band = tenureBand(answers.tenure);
    var tenurePhrase = answers.tenure === 'פחות משנה' ? 'רק בהתחלה, פחות משנה בתחום' : 'כבר ' + answers.tenure + ' בתחום';
    var prefix = 'בתור ' + roleForPrefix(answers) + ', ' + tenurePhrase + ': ';
    if (band === 'new') {
      var r = getRole(answers);
      var core = r.type === 'clinical'
        ? 'מול ילד שמתקשה, מרגיש לך טבעי למצוא את הדרך הנכונה בשבילו?'
        : 'במפגש עם הילדים, מרגיש לך טבעי לדבר איתם וללמד אותם?';
      return { type: 'choice', id: 'confidence', title: prefix + core, options: [
        'כן, ממש בטוחה בעצמי', 'לרוב כן, אבל לפעמים מתלבטת', 'לא תמיד, זה תלוי בילד', 'לא ממש, אני עדיין לומדת את זה'
      ]};
    }
    var appreciationCore = isNonJobRoleText(answers)
      ? 'את מרגישה שמעריכים אותך ואת המאמץ שלך היום, כמו שמגיע לך?'
      : 'האם מה שאת מרוויחה משקף את המאמץ וההשקעה שלך?';
    return { type: 'choice', id: 'appreciation', title: prefix + appreciationCore, options: [
      'כן, לגמרי', 'חלקית', 'לא, ואני מרגישה את זה הרבה', 'ממש לא, וזה מתסכל אותי'
    ]};
  }
  if (index === 4) {
    var band2 = tenureBand(answers.tenure);
    if (band2 === 'new') {
      var cband = confidenceBand(answers.confidence);
      if (cband === 'confident') {
        return { type: 'choice', id: 'deepen', title: 'אז מה בעיקר עוצר אותך מלפתוח כבר עכשיו קבוצה משלך?', options: [
          'לא יודעת איך לשווק את עצמי', 'לא בטוחה שיש לי שיטה מסודרת, לא רק אינטואיציה', 'פשוט לא ידעתי שזה אפשרי, מאיפה להתחיל', 'שום דבר, פשוט לא התחלתי עדיין'
        ]};
      }
      return { type: 'choice', id: 'deepen', title: 'מה הכי גורם לך להרגיש פחות בטוחה?', options: [
        'התמודדות עם ילדים מאתגרים או עם קשיי למידה', 'לא בטוחה שהשיטות שלי הכי טובות', 'חוששת מתגובת ההורים אם משהו לא ילך חלק', 'בכלל לא בטוחה שיש לי את זה'
      ]};
    }
    var aband = apprBand(answers.appreciation);
    if (aband === 'appreciated') {
      return { type: 'choice', id: 'deepen', title: 'אז מה כן ימשוך אותך לקחת צעד נוסף?', options: [
        'הכנסה נוספת משמעותית', 'להיות עצמאית, לא תלויה במסגרת', 'להגיע ליותר ילדים ולהשפיע יותר', 'הכל ביחד'
      ]};
    }
    var secondOption = isNonJobRoleText(answers) ? 'הכנסה כספית שאני מרוויחה בעצמי' : 'שכר שמשקף את המאמץ';
    return { type: 'choice', id: 'deepen', title: 'מה הכי היה משנה לך את התחושה הזו?', options: [
      'הכרה מקצועית אמיתית', secondOption, 'שתיהן ביחד', 'לצאת למסלול שבו אני שולטת בעצמי, לא תלויה במערכת'
    ]};
  }
  if (index === 5) {
    return { type: 'slider', id: 'selfBelief', title: 'נשים בתוכנית עברו משעה אחת בשבוע (3,000 ₪) ועד 8,000-18,000 ₪ בחודש. את, כמה מקום את מרגישה שיש לך להשיג מעבר למה שיש לך היום?' };
  }
  if (index === 6) {
    return { type: 'choice', id: 'income', title: 'כמה היית רוצה להוסיף להכנסה החודשית שלך?', options: [
      '1,000 ₪+ (רק כדי להתחיל, בקצב שלי)',
      '3,000 ₪ (קבוצת הכנה לכיתה א׳ אחת, שעה בשבוע)',
      '8,000-18,000 ₪ (כמה קבוצות או שיעורים פרטיים לילדים בגילי 5-8, 4-6 שעות בשבוע)',
      'הכי הרבה שאפשר, אני רצינית בקטע הזה'
    ]};
  }
  if (index === 7) {
    var amt = incomeAmountLabel(answers);
    var isMaxIncome = answers.income === 'הכי הרבה שאפשר, אני רצינית בקטע הזה';
    var q8Title = isMaxIncome
      ? 'תארי לעצמך סוף חודש: כל החשבונות שולמו, והגעת בדיוק לסכום שחלמת עליו. מה קורה קודם? (אפשר לסמן כמה שרוצים)'
      : 'תארי לעצמך סוף חודש: כל החשבונות שולמו, ויש לך עוד ' + amt + ' שנשארו בצד. מה קורה קודם? (אפשר לסמן כמה שרוצים)';
    return { type: 'multiselect', id: 'feelings', title: q8Title, options: [
      'לא בודקת שוב ושוב את היתרה בבנק',
      'לא נלחצת כשמגיע חיוב בלתי צפוי',
      'אזמין לעצמי חופשה או מוצר שדחיתי',
      'הייתי יכולה להשקיע יותר בזוגיות או במשפחה שלי',
      'גאה בעצמי שהצלחתי לשנות את זה'
    ]};
  }
  if (index === 8) {
    return { type: 'choice', id: 'pastFear', title: 'קרה לך בעבר שלמדת קורס או הכשרה, התלהבת, אבל בסוף לא ממש יישמת?', options: [
      'כן, כמה פעמים', 'קצת', 'לא, אני בדרך כלל מיישמת'
    ]};
  }
  if (index === 9) {
    return { type: 'choice', id: 'timeForMaterials', title: 'כמה זמן פנוי יש לך היום ליצור חומרי לימוד ותוכן לקבוצה?', options: [
      'יש לי זמן, אני אוהבת ליצור בעצמי',
      'קצת, אבל אני מעדיפה למקד את הזמן שלי בילדים ולא בהכנות',
      'אין לי זמן, אני מעדיפה שהכל יהיה מוכן וברמה גבוהה'
    ]};
  }
  if (index === 10) {
    var communityTitle = 'אם היית יכולה להיות חלק מקהילה של ' + communityLabel(answers) + ' שמקבלת ליווי מקצועי ועסקי, ובה אפשר לדבר בחופשיות על כסף ואתגרים, היית לוקחת את האפשרות?';
    return { type: 'choice', id: 'community', title: communityTitle, options: [
      'כן, ליווי וקהילה זה בדיוק מה שיחסר לי',
      'זה יכול לעזור, אבל אני גם עצמאית',
      'אני מעדיפה לעשות דברים לבד',
      'כן, כי אני מאמינה שתמיד אפשר ללמוד ולהתפתח'
    ]};
  }
  if (index === 11) {
    var amt2 = incomeAmountLabel(answers);
    var isMaxIncome2 = answers.income === 'הכי הרבה שאפשר, אני רצינית בקטע הזה';
    var timingTitle = isMaxIncome2
      ? 'כאחת ששואפת לכמה שיותר תוספת בחודש: מתי היית רוצה להתחיל לקבל ילדים בפועל?'
      : 'אז את שואפת ל-' + amt2 + ' נוספים בחודש: מתי היית רוצה להתחיל לקבל ילדים בפועל?';
    return { type: 'choice', id: 'timing', title: timingTitle, options: [
      'מיד עם סיום ההכשרה, שעה אחת בשבוע ולהגביר בהדרגה', 'מיד, וישר כמה שעות בשבוע', 'רק אחרי שאני מרגישה בטוחה לגמרי', 'עדיין לא יודעת, בודקת אפשרויות'
    ]};
  }
  return { type: 'choice', id: 'stayingPut', title: 'תארי לעצמך שעוד שנה את בדיוק באותו מקום שאת בו היום. מה עולה אצלך?', options: [
    'אני אתאכזב מעצמי',
    'אני ממש לא רוצה להישאר באותו מקום',
    'לא אכפת לי להישאר במקום, אין לי לחץ',
    'הייתי מרגישה תקועה, לא מתקדמת'
  ]};
}

var TOTAL_STEPS = 13;

function isSkippedStep(index, answers) {
  if (index === 4) {
    return tenureBand(answers.tenure) === 'veteran' && apprBand(answers.appreciation) === 'unappreciated';
  }
  return false;
}
function nextValidIndex(index, answers) {
  while (index < TOTAL_STEPS && isSkippedStep(index, answers)) index++;
  return index;
}
function prevValidIndex(index, answers) {
  while (index > 0 && isSkippedStep(index, answers)) index--;
  return index;
}

function buildResultText(base, answers) {
  var text = base;
  if (answers.timeForMaterials === 'אין לי זמן, אני מעדיפה שהכל יהיה מוכן וברמה גבוהה') {
    text += ' בדיוק בשביל זה כל החומרים בתוכנית כבר מוכנים ברמה גבוהה, שיעור אחרי שיעור: את לא בונה שום דבר מאפס.';
  }
  if (answers.community === 'כן, ליווי וקהילה זה בדיוק מה שיחסר לי') {
    text += ' ואת לא עושה את זה לבד: יש קבוצת ליווי קהילתית ופגישות זום קבוצתיות לאורך כל השנה הראשונה.';
  }
  return text;
}

function getResult(answers) {
  var band = tenureBand(answers.tenure);
  var base;
  if (band === 'new') {
    var cband = confidenceBand(answers.confidence);
    base = cband === 'confident'
      ? { title: 'הכוכבת הבאה', text: 'את עוד בהתחלת הדרך המקצועית, אבל כבר עכשיו יש לך את מה שהכי קשה להקנות: ביטחון טבעי מול ילדים. זה בדיוק המקום שבו רוב הנשים שמצליחות פותחות קבוצת הכנה לכיתה א׳ ראשונה, לא כשיש להן יותר ניסיון, אלא כשיש להן שיטה מסודרת שהן פשוט מיישמות במקום להמציא הכל לבד. עם קבוצה אחת בשבוע כבר אפשר להוסיף כ-3,000 ₪ בחודש, ועם שתי קבוצות או שילוב שיעורים פרטיים אפשר להגיע הרבה יותר גבוה, בלי לוותר על הזמן שלך עם המשפחה. את בדיוק הטיפוס שקופץ קדימה מהר כשיש לו את הכלים הנכונים. השאלה היחידה שנשארה היא איך מתחילים נכון, לא אם יש לך את זה.' }
      : { title: 'המחפשת קרקע יציבה', text: 'את בהתחלת הדרך, ולפעמים זה מרגיש כמו יותר מדי לבד. זה נורמלי לגמרי: הביטחון לא בא מעוד שנים של ניסיון וטעייה, הוא בא משיטה מסודרת וכלים מוכנים שאת פשוט מיישמת, בלי לבנות הכל מאפס בעצמך. השיטה בנויה כך שהיא נותנת מענה גם לילדים מאתגרים ולקשיי למידה, בדיוק החששות שכנראה מוכרים לך. הביטחון שאת מחפשת יכול להגיע הרבה יותר מהר ממה שאת חושבת, לא כי תלמדי עוד תיאוריה, אלא כי תלכי לפי דרך שכבר עבדה על מאות נשים לפנייך, עם ליווי צמוד שלוקח אותך צעד-צעד. את לא צריכה לדעת הכל מראש כדי להתחיל.' };
  } else {
    var aband = apprBand(answers.appreciation);
    base = aband === 'appreciated'
      ? { title: 'המוכנה לצעד הבא', text: 'את כבר טובה במה שאת עושה, ומרגישה את זה, וגם מרגישה שמעריכים אותך. השאלה בשבילך היא לא האם את מספיק טובה, אלא איך לוקחת את מה שכבר יש לך והופכת אותו למשהו גדול יותר. עם הניסיון שכבר צברת, המעבר לעצמאות קצר בהרבה ממה שהוא נראה מבחוץ: לא צריך להתחיל מאפס, רק להוסיף את המסגרת העסקית שחסרה כדי להפוך את הידע שלך להכנסה נוספת משמעותית, בקצב ובהיקף שאת בוחרת. את בדיוק הטיפוס שמוכן לצעד הבא, צריך רק לתת לו כיוון ברור.' }
      : { title: 'המומחית שלא רואים', text: 'יש לך את הידע, את הניסיון, ואת השנים, ופשוט לא מקבלים ממך את מה שמגיע לך על זה. עולם החינוך והטיפול לא תמיד מאפשר היום שכר שמשקף את העשייה האמיתית שלך, וזה לא קשור ליכולת שלך. בדיוק בשביל זה התוכנית נותנת מסגרת עסקית שהופכת את מה שכבר יש לך להכנסה שמשקפת את השווי האמיתי שלך. נשים עם הרקע שלך עוברות יחסית בקלות לקבוצה ראשונה, כי כמעט הכל כבר קיים אצלך מבחינה מקצועית, ונשאר רק להפוך את זה לעסק. העצמאות לא רק תשלם לך יותר, היא תיתן לך סוף סוף את ההכרה שהיית צריכה לקבל כבר מזמן.' };
  }
  return { title: base.title, text: buildResultText(base.text, answers) };
}

function setState(patch) {
  Object.assign(state, patch);
  render();
}

function start() { setState({ screen: 'question', qIndex: 0 }); }

function selectOption(qid, isRole, value) {
  if (isRole && value === 'אחר') { setState({ pendingOther: true }); return; }
  var answers = Object.assign({}, state.answers);
  answers[qid] = value;
  var nextIndex = nextValidIndex(state.qIndex + 1, answers);
  trackEvent('question_answered', { qid: qid, value: value });
  if (nextIndex >= TOTAL_STEPS) {
    setState({ answers: answers, screen: 'leadform' });
  } else {
    setState({ answers: answers, qIndex: nextIndex, pendingOther: false, otherText: '', sliderValue: 2, msSelected: [false, false, false, false, false] });
  }
}

function submitOther() {
  var text = (state.otherText || '').trim();
  if (!text) return;
  var answers = Object.assign({}, state.answers);
  answers.role = text;
  setState({ answers: answers, qIndex: nextValidIndex(state.qIndex + 1, answers), pendingOther: false, otherText: '' });
}

function continueSlider() {
  var answers = Object.assign({}, state.answers);
  answers.selfBelief = state.sliderValue;
  trackEvent('question_answered', { qid: 'selfBelief', value: state.sliderValue });
  setState({ answers: answers, qIndex: nextValidIndex(state.qIndex + 1, answers), sliderValue: 2 });
}

function toggleMsOption(i) {
  var sel = state.msSelected.slice();
  sel[i] = !sel[i];
  setState({ msSelected: sel });
}

function continueMultiselect() {
  var q = getQuestion(state.qIndex, state.answers);
  var picked = [];
  for (var i = 0; i < q.options.length; i++) { if (state.msSelected[i]) picked.push(q.options[i]); }
  var answers = Object.assign({}, state.answers);
  answers[q.id] = picked;
  trackEvent('question_answered', { qid: q.id, value: picked });
  setState({ answers: answers, qIndex: nextValidIndex(state.qIndex + 1, answers), msSelected: [false, false, false, false, false] });
}

function goBack() {
  if (state.qIndex === 0) { setState({ screen: 'intro' }); return; }
  setState({ qIndex: prevValidIndex(state.qIndex - 1, state.answers), pendingOther: false });
}

function submitLead() {
  var name = (state.leadName || '').trim();
  var phone = (state.leadPhone || '').trim();
  if (!name || !phone) { setState({ leadError: true }); return; }
  setState({ leadSubmitting: true });
  trackEvent('lead_captured', { name: name, phone: phone, answers: state.answers });
  sendLeadToWebhook(name, phone, state.answers);
  setState({ screen: 'result', leadSubmitting: false });
}

function ctaClick() {
  trackEvent('cta_clicked', { name: state.leadName, phone: state.leadPhone });
}

// ============================================================
// רינדור
// ============================================================
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function render() {
  var app = document.getElementById('app');
  var html = '';

  if (state.screen === 'intro') {
    html += ''
      + '<div style="text-align:center;padding:10px 0 2px;">'
      + '  <svg width="40" height="40" viewBox="0 0 40 40" fill="none" style="margin-bottom:18px;">'
      + '    <path d="M20 4 L23 16 L35 20 L23 24 L20 36 L17 24 L5 20 L17 16 Z" stroke="#6FB79C" stroke-width="2" stroke-linejoin="round" fill="none"></path>'
      + '  </svg>'
      + '  <h1 style="font-size:25px;font-weight:700;line-height:1.4;margin:0 0 14px;color:#3A342E;">בחני את עצמך:<br>איזה סוג של אשת חינוך וטיפול את?</h1>'
      + '  <p style="font-size:16px;line-height:1.65;color:#6B6459;margin:0 0 28px;">כמה שאלות קצרות, ובסוף תדעי בדיוק איזה טיפוס את ומה הצעד הבא המתאים לך.</p>'
      + '  <button id="btn-start" class="cta-btn">בואי נתחיל</button>'
      + '</div>';
  }

  if (state.screen === 'question') {
    var q = getQuestion(state.qIndex, state.answers);
    var progressPct = Math.round((state.qIndex / TOTAL_STEPS) * 100);
    var stepLabel = 'שאלה ' + (state.qIndex + 1) + ' מתוך ' + TOTAL_STEPS;

    html += '<div>';
    html += '<div style="height:6px;background:#F0EDE6;border-radius:6px;overflow:hidden;margin-bottom:8px;"><div style="height:100%;width:' + progressPct + '%;background:#6FB79C;border-radius:6px;transition:width .25s ease;"></div></div>';
    html += '<div style="font-size:13px;color:#9B9484;margin-bottom:22px;">' + esc(stepLabel) + '</div>';
    html += '<h2 style="font-size:20px;font-weight:600;line-height:1.55;margin:0 0 22px;color:#3A342E;">' + esc(q.title) + '</h2>';

    if (q.type === 'choice') {
      html += '<div>';
      for (var i = 0; i < q.options.length; i++) {
        html += '<button class="opt-btn" data-choice-index="' + i + '">' + esc(q.options[i]) + '</button>';
      }
      html += '</div>';
      if (q.isRole && state.pendingOther) {
        html += '<div style="margin-top:2px;">'
          + '<input type="text" id="other-input" class="field" placeholder="איזה תפקיד?" value="' + esc(state.otherText) + '">'
          + '<button id="btn-other-submit" class="cta-btn">המשך</button>'
          + '</div>';
      }
    }

    if (q.type === 'slider') {
      var emoji = ['😐','😐','🙂','😃','🤩'][state.sliderValue] || '🙂';
      html += '<div style="text-align:center;padding:6px 0 4px;">'
        + '<div style="font-size:52px;margin-bottom:14px;">' + emoji + '</div>'
        + '<input type="range" id="slider-input" min="1" max="4" step="1" value="' + state.sliderValue + '">'
        + '<div style="display:flex;justify-content:space-between;font-size:12px;color:#9B9484;margin-bottom:22px;"><span>קצת</span><span>המון</span></div>'
        + '<button id="btn-slider-continue" class="cta-btn">המשך</button>'
        + '</div>';
    }

    if (q.type === 'multiselect') {
      html += '<div>';
      for (var j = 0; j < q.options.length; j++) {
        var selected = state.msSelected[j];
        html += '<button class="opt-btn' + (selected ? ' is-selected' : '') + '" data-ms-index="' + j + '">' + (selected ? '✓ ' : '') + esc(q.options[j]) + '</button>';
      }
      html += '<button id="btn-ms-continue" class="cta-btn">המשך</button>';
      html += '</div>';
    }

    html += '<button id="btn-back" class="back-lnk">חזרה</button>';
    html += '</div>';
  }

  if (state.screen === 'leadform') {
    html += '<div style="text-align:center;padding:10px 0;">'
      + '<h2 style="font-size:19px;font-weight:600;line-height:1.6;margin:0 0 22px;color:#3A342E;">כמעט סיימנו!<br>השאירי שם וטלפון ותקבלי את הניתוח האישי שלך</h2>'
      + '<input type="text" id="lead-name" class="field" placeholder="שם" value="' + esc(state.leadName) + '">'
      + '<input type="tel" id="lead-phone" class="field" placeholder="טלפון" value="' + esc(state.leadPhone) + '">'
      + (state.leadError ? '<div style="color:#C0546B;font-size:14px;margin-bottom:12px;">נא למלא שם וטלפון</div>' : '')
      + '<button id="btn-lead-submit" class="cta-btn"' + (state.leadSubmitting ? ' disabled' : '') + '>חן תראי לי!</button>'
      + '</div>';
  }

  if (state.screen === 'result') {
    var result = getResult(state.answers);
    html += '<div style="text-align:center;padding:8px 0;">'
      + '<svg width="36" height="36" viewBox="0 0 40 40" fill="none" style="margin-bottom:16px;"><path d="M20 4 L23 16 L35 20 L23 24 L20 36 L17 24 L5 20 L17 16 Z" stroke="#6FB79C" stroke-width="2" stroke-linejoin="round" fill="none"></path></svg>'
      + '<div style="font-size:14px;color:#9B9484;margin-bottom:6px;">הטיפוס שלך</div>'
      + '<h2 style="font-size:24px;font-weight:700;margin:0 0 18px;color:#3A342E;">' + esc(result.title) + '</h2>'
      + '<p style="font-size:16px;line-height:1.75;color:#54504A;margin:0 0 30px;text-align:right;">' + esc(result.text) + '</p>'
      + '<a href="https://talkwithkids.co.il/thankyou1" id="cta-final" class="cta-btn">אם תרצי להגשים את החלום, לחצי כאן ואחזור אליך לבדיקת התאמה</a>'
      + '</div>';
  }

  app.innerHTML = html;
  attachHandlers();
}

function attachHandlers() {
  var el;

  el = document.getElementById('btn-start');
  if (el) el.onclick = start;

  var choiceBtns = document.querySelectorAll('[data-choice-index]');
  if (choiceBtns.length) {
    var q = getQuestion(state.qIndex, state.answers);
    choiceBtns.forEach(function (btn) {
      var i = parseInt(btn.getAttribute('data-choice-index'), 10);
      btn.onclick = function () { selectOption(q.id, !!q.isRole, q.options[i]); };
    });
  }

  el = document.getElementById('other-input');
  if (el) el.oninput = function (e) { state.otherText = e.target.value; };
  el = document.getElementById('btn-other-submit');
  if (el) el.onclick = submitOther;

  el = document.getElementById('slider-input');
  if (el) el.oninput = function (e) { setState({ sliderValue: parseInt(e.target.value, 10) || 1 }); };
  el = document.getElementById('btn-slider-continue');
  if (el) el.onclick = continueSlider;

  var msBtns = document.querySelectorAll('[data-ms-index]');
  msBtns.forEach(function (btn) {
    var i = parseInt(btn.getAttribute('data-ms-index'), 10);
    btn.onclick = function () { toggleMsOption(i); };
  });
  el = document.getElementById('btn-ms-continue');
  if (el) el.onclick = continueMultiselect;

  el = document.getElementById('btn-back');
  if (el) el.onclick = goBack;

  el = document.getElementById('lead-name');
  if (el) el.oninput = function (e) { state.leadName = e.target.value; state.leadError = false; };
  el = document.getElementById('lead-phone');
  if (el) el.oninput = function (e) { state.leadPhone = e.target.value; state.leadError = false; };
  el = document.getElementById('btn-lead-submit');
  if (el) el.onclick = submitLead;

  el = document.getElementById('cta-final');
  if (el) el.onclick = ctaClick;
}

render();
</script>

</html>
